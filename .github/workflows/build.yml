# BUILD ARMBIAN IMAGE
name: Build Armbian Image

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Cache Armbian Artifacts
        uses: actions/cache@v4
        with:
          path: build/.cache
          key: ${{ runner.os }}-armbian-uefi-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-armbian-uefi-

      - name: Build Image
        uses: armbian/build@main
        with:
          armbian_token: ${{ secrets.GITHUB_TOKEN }}
          armbian_board: "uefi-arm64"
          armbian_release: "trixie"
          armbian_kernel_branch: "current"
          armbian_target: "build"
          armbian_extra_args: 'ARTIFACT_IGNORE_CACHE=no USE_PREBUILT_KERNEL=yes SKIP_ARMBIAN_REPO=no BUILD_MINIMAL=yes KERNEL_CONFIGURE=no INCLUDE_HOME_DIR=yes FIXED_IMAGE_SIZE=65536'

      - name: Upload Image Artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: compiled-armbian-image
          path: |
            build/output/images/*
            **/output/images/*
          if-no-files-found: error
          retention-days: 5